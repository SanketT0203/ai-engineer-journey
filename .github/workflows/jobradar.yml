name: JobRadar daily run

on:
  schedule:
    # 06:00 UTC every day -> ~08:00 Berlin time in summer (CEST), ~07:00 in
    # winter (CET). Cron is always UTC and GitHub does NOT shift it for
    # daylight saving, so your actual local delivery time drifts by an hour
    # twice a year -- that's expected, not a bug. Change the hour below if
    # you want a different time (e.g. "0 4 * * *" for ~06:00 Berlin summer).
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger a run by hand from the Actions tab, without waiting for the schedule

# jobradar.py writes jobradar_seen.json, the digest files, and usage_log.csv
# back to disk -- this run needs write access to commit those changes back
# to the repo so tomorrow's run (a fresh, empty runner) picks up where
# today's left off.
permissions:
  contents: write

# Stops a manual "Run workflow" click from overlapping a scheduled run and
# racing on the same seen-state files / commit.
concurrency:
  group: jobradar-daily
  cancel-in-progress: false

env:
  # Wherever jobradar.py actually lives in YOUR repo -- this matches your
  # local E:\ai-engineer-journey\week2\ layout. Change it if your repo
  # structure differs (or set it to "." if jobradar.py sits at the repo root).
  PROJECT_DIR: week2

jobs:
  run-jobradar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      # sentence-transformers downloads the embedding model (~90MB) the
      # first time it's used. Caching it means every run after the first
      # skips that download instead of re-fetching it daily.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: uv sync --locked

      - name: Run JobRadar
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run python jobradar.py

      # On a "nothing new today" day, jobradar.py exits before writing
      # anything -- git diff is empty and this step is a harmless no-op
      # rather than an empty commit.
      - name: Commit updated state
        run: |
          git config user.name "jobradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed (no new postings today) -- skipping commit."
          else
            git commit -m "chore: JobRadar daily run $(date -u +%Y-%m-%d)"
            git push
          fi
